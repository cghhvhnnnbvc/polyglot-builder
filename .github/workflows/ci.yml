name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux 需系统 tkinter 库 (供 test_polyglot 导入 polyglot_gui);
      # xvfb 提供虚拟显示, 使 GUI 用例在无头环境也能实跑而非跳过。
      - name: Install tkinter + xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy

      - name: Type check (mypy)
        run: python -m mypy

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest test_polyglot -v

      - name: Unit tests (Linux via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest test_polyglot -v
