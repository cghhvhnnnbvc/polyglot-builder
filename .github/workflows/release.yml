# 自动发版工作流: 推送 v* 标签时触发
# 流程: 校验标签与 VERSION 一致 → 跑测试 → PyInstaller 打包 → 压缩 → 创建 Release 并上传 zip
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 防呆: 标签名必须与 polyglot_build.VERSION 常量一致 (如 v1.0 ↔ '1.0'),
      # 防止版本号漂移 (曾发生过 bat/文档/代码版本号不一致的问题)
      # 注: shell: python 执行时 sys.path[0] 是临时脚本目录而非仓库根目录,
      # 必须显式设置 PYTHONPATH 才能导入 polyglot_build
      - name: 校验标签与 VERSION 常量一致
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import polyglot_build, os
          tag = os.environ['GITHUB_REF_NAME']
          ver = 'v' + polyglot_build.VERSION
          assert tag == ver, f'标签 {tag} 与 VERSION 常量 {ver} 不一致, 请先统一版本号'

      - name: 运行测试
        run: python -m unittest test_polyglot -v

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包 (onedir)
        run: pyinstaller --noconfirm polyglot_builder.spec

      # 产物为 dist/PolyglotBuilder/ (exe + _internal/), 压缩后解压即用
      # 注: 仓库不含 ffmpeg/ (被 .gitignore 排除), 程序运行时按需下载
      - name: 压缩产物
        run: Compress-Archive -Path dist/PolyglotBuilder -DestinationPath "PolyglotBuilder-${{ github.ref_name }}-windows-x64.zip"

      # Release 正文模板: 每次发版前只需把"本版本新增"改成该版本的亮点,
      # 其余部分 (下载说明 / 快速上手) 保持不变; Full Changelog 由 action 自动追加。
      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: PolyglotBuilder-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
          # 标题默认等于标签名; 需要副标题时在此改写 (如 "v1.2.1 — 界面布局修复")
          name: ${{ github.ref_name }} — 界面布局修复
          body: |
            ## 📒 本版本新增 (v1.2.1)

            - **修复界面裁切**: 高 DPI/大字体下, 选项区的"硬件编码"勾选被裁在窗口右缘导致看不到; 改为按功能分组的两行——第一行 Deflate, 第二行"压缩表面视频"整组 (启用开关 + 档位 + 硬件编码) 同排并左缩进, 实测 100%~220% 缩放下都不再裁切
            - **修复"压缩表面视频"复选框不生效**: 此前未勾选也会压缩外层视频; 现以复选框为准
            - **修复档位默认值**: 下拉框默认误显示"高"档, 现正确默认"中 (推荐)"
            - 复选框与说明角标的字号改为随界面字体等比缩放, 高 DPI 下布局更准确

            > 除界面布局外, 本版还修复两个功能性问题: 未勾选"压缩表面视频"也会压缩、档位默认误显示"高"。其余功能与 v1.2 相同: 压缩提速 2~3.8 倍、进度显示预计剩余时间、可选硬件编码、资源台账等。

            ---

            ## 📦 下载与使用

            - **Windows 用户**：下载下方 `PolyglotBuilder-*.zip`，解压后**双击 `PolyglotBuilder.exe`** 即可使用，**无需安装 Python**
            - 首次运行如遇 Windows SmartScreen 或杀毒软件提醒，属未签名开源程序的常见提示，选择"仍要运行"即可
            - 仅需源码的话，下载 `Source code (zip)` 即可

            ## 🚀 快速上手

            1. 用 **WinRAR** 将要保护的文件压缩为 RAR 格式，并设置密码（务必勾选"加密文件名"）
            2. 打开 PolyglotBuilder，选择一个正常的视频/图片/文档作为**外层文件**
            3. 选择加密的 **RAR 文件**，点"开始构建"
            4. 生成的文件可正常播放/打开；将其后缀改为 `.zip` 后，又能解压出加密的 RAR
            5. （可选）构建成功后选择"记入资源台账"，记下网盘位置与密码

            详细说明见 [README](https://github.com/cghhvhnnnbvc/polyglot-builder#readme) 与 [资源台账文档](https://github.com/cghhvhnnnbvc/polyglot-builder/blob/main/docs/ledger.md)。
